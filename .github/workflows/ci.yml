name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run no-platform-drift check
        run: ./scripts/check-no-platform-drift.sh
      - name: Run no-dismiss-in-nav-owner check
        run: ./scripts/check-no-dismiss-in-nav-owner.sh
      - name: Run acknowledgements drift check
        run: ./scripts/check-acknowledgements.sh
      - name: Run scaled time limit check
        run: ./scripts/check-scaled-time-limits.sh

  # Packages that declare macOS as a test host run as plain `swift test` with no
  # simulator boot; scripts/verify.sh owns the list. The real-Keychain suites need the
  # data-protection keychain, which an unentitled host lacks, so they skip themselves
  # here and run inside the app in app-hosted-tests.
  host-tests:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # CITimeScale widens anti-hang deadlines when CI is set.
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run host package tests
        # Worst observed 11.2 min. Under the job limit so a wedge fails here, attributed, before the job kill.
        timeout-minutes: 17
        run: scripts/verify.sh

  package-tests:
    # The code builds against the iOS/tvOS 27 SDK, and xcode-27 is the image that
    # ships it (macos-26 tops out at Xcode 26.6). The deployment target stays 26.0;
    # the SDK and the floor are separate numbers.
    runs-on: xcode-27
    # A hung media/simulator call must fail the job in minutes, not squat on the
    # runner for the 6-hour default (ImageIO finalize hangs observed on this image).
    timeout-minutes: 20
    strategy:
      # One package's runner-speed flake must not cancel (and mask) the others.
      fail-fast: false
      matrix:
        include:
          # Multi-product packages get per-product autogenerated schemes; only
          # the "-Package" scheme carries a test action.
          - package: ParallaxPlaybackVLC
            scheme: ParallaxPlaybackVLC-Package
            vlckit: true
          # Host-capable too, and run by host-tests; the simulator run covers what
          # differs on iOS (AVFoundation and ImageIO here, libass and CoreText there).
          - package: ParallaxPlayback
            scheme: ParallaxPlayback-Package
          - package: ParallaxSubtitles
            scheme: ParallaxSubtitles
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # latest-stable tracks the runner image instead of rotting like a
          # hard pin; the Xcode 27 floor comes from the runs-on image choice.
          xcode-version: latest-stable
      - name: Fetch VLCKit binaries
        # Only ParallaxPlaybackVLC resolves that graph.
        if: matrix.vlckit
        uses: ./.github/actions/fetch-vlckit
      - name: Run ${{ matrix.package }} tests
        # Worst observed 8.4 min; the job limit is 20 (setup included).
        timeout-minutes: 17
        # VLCKit has no macOS build, so ParallaxPlaybackVLC can only test in the iOS Simulator.
        # The device is discovered from the image's own inventory instead of
        # hardcoding a model name that rots when the simulator lineup rotates.
        working-directory: Packages/${{ matrix.package }}
        env:
          # Forwarded into the simulator test host as CI= (xcodebuild strips the
          # TEST_RUNNER_ prefix): CITimeScale widens anti-hang deadlines on it, and the
          # live-VLC-decode suite skips itself.
          TEST_RUNNER_CI: 'true'
        run: |
          # The ` *$` (not `$`) matters: `simctl list` pads a trailing space after the
          # state, and an anchored-$ pattern then matches nothing and passes the whole
          # "name (UUID) (Shutdown) " string through as the destination.
          DEVICE=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/^ +//; s/ \([^)]*\) \([^)]*\) *$//')
          echo "Testing on simulator: ${DEVICE}"
          # No diagnostics collection: after a failed run it waits up to 600s on the
          # simulator, past the step timeout, and turns one red test into a killed job.
          xcodebuild test \
            -scheme ${{ matrix.scheme }} \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -collect-test-diagnostics never

  app-build:
    runs-on: xcode-27
    timeout-minutes: 30
    needs: [drift-check, host-tests, package-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch VLCKit binaries
        uses: ./.github/actions/fetch-vlckit
      - name: Build app
        # Generic destination builds against the iOS Simulator SDK without
        # requiring a specific simulator model — robust to runner image changes.
        run: |
          xcodebuild build \
            -project Parallax.xcodeproj \
            -scheme Parallax \
            -destination 'generic/platform=iOS Simulator'

  # App-hosted ParallaxTests (host app + test bundle). Package-tests alone miss
  # cross-boundary cast bugs from a second static ParallaxCore copy in the bundle.
  app-hosted-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    needs: [drift-check, host-tests, package-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch VLCKit binaries
        uses: ./.github/actions/fetch-vlckit
      - name: Run ParallaxTests
        # Device from the image inventory — same rot-proof pattern as package-tests.
        env:
          TEST_RUNNER_CI: 'true'
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/^ +//; s/ \([^)]*\) \([^)]*\) *$//')
          echo "Testing on simulator: ${DEVICE}"
          xcodebuild test \
            -project Parallax.xcodeproj \
            -scheme Parallax \
            -destination "platform=iOS Simulator,OS=latest,name=${DEVICE}" \
            -only-testing:ParallaxTests \
            -collect-test-diagnostics never

  # Release compiles whole-module under -O, and that pass rejects names
  # Debug's per-file pass lets through. The v1.2.0 archive failed on a
  # leading-dot enum case whose module the file never imported, after
  # Debug had built it on every platform. One platform is enough here;
  # the compiler pass is the same on tvOS.
  release-build:
    runs-on: xcode-27
    timeout-minutes: 30
    needs: [drift-check, host-tests, package-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch VLCKit binaries
        uses: ./.github/actions/fetch-vlckit
      - name: Build app in Release
        run: |
          xcodebuild build \
            -project Parallax.xcodeproj \
            -scheme Parallax \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator'

  tvos-build:
    runs-on: xcode-27
    timeout-minutes: 30
    needs: [drift-check, host-tests, package-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch VLCKit binaries
        uses: ./.github/actions/fetch-vlckit
      - name: Build app for tvOS Simulator
        run: |
          xcodebuild build \
            -project Parallax.xcodeproj \
            -scheme Parallax \
            -destination 'generic/platform=tvOS Simulator'
