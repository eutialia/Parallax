name: Fetch VLCKit binaries
description: >
  Puts the vendored MobileVLCKit (iOS) and TVVLCKit (tvOS) xcframeworks in place.
  They are git-ignored, and the ParallaxPlayback binary targets point straight at
  them, so the package graph will not even resolve until both exist — every job
  that touches ParallaxPlayback needs this, whichever platform it builds for.

runs:
  using: composite
  steps:
    - name: Read vendored VLCKit versions
      id: versions
      shell: bash
      # The two version strings are the only thing that decides what lands in
      # Vendor/, so they alone key the cache — editing a comment in the fetch
      # script must not throw away a multi-hundred-MB download.
      run: |
        KEY=$(grep -hE '^(MOBILE|TV)_VERSION=' scripts/fetch-mobilevlckit.sh \
              | cut -d'"' -f2 | paste -sd '_' -)
        echo "Vendored VLCKit: ${KEY}"
        echo "key=${KEY}" >> "$GITHUB_OUTPUT"

    - name: Restore VLCKit cache
      uses: actions/cache@v4
      with:
        path: Packages/ParallaxPlayback/Vendor
        key: vlckit-${{ steps.versions.outputs.key }}

    - name: Fetch any missing VLCKit binary
      shell: bash
      # Run unconditionally rather than behind a cache-hit check: the script is
      # idempotent per framework, so a hit costs two directory tests and a
      # half-restored cache still repairs itself.
      run: ./scripts/fetch-mobilevlckit.sh
